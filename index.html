/* Layout: public site (sticky bar, hero + finder, catalog, calculator, contacts) and an owner-only panel on #panel that edits the same data */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#14201b; --muted:#56635d; --line:#d5dad3;
  --accent:#b8892b; --accent-ink:#1a1405; --deep:#17382c; --deep-ink:#eef0ec; --good:#2e7d4f; --bad:#b3372c;
  --f-display:'Unbounded','Arial Black',sans-serif; --f-body:'Onest','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201b; --ink:#e9eee9; --muted:#9aa89f; --line:#2a3731;
  --accent:#d3a444; --accent-ink:#1a1405; --deep:#1d4636; --deep-ink:#eef3ee; --good:#5fbf86; --bad:#e2776c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201b; --ink:#e9eee9; --muted:#9aa89f; --line:#2a3731;
  --accent:#d3a444; --accent-ink:#1a1405; --deep:#1d4636; --deep-ink:#eef3ee; --good:#5fbf86; --bad:#e2776c; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.4rem,4.5vw,2rem)}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.1rem;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--deep);display:grid;place-items:center}
.logo i svg{width:18px;height:18px}
nav{display:flex;gap:18px;font-size:.9rem;font-weight:500;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}
.phone{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:9px 14px;text-decoration:none;font-size:.9rem;white-space:nowrap}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;padding-block:44px 36px;align-items:center}
.hero h1{font-size:clamp(1.8rem,6vw,3.1rem);margin-block:12px 16px}
.hero p.lead{color:var(--muted);max-width:52ch;font-size:1.05rem}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px}
.facts div{min-width:0}
.facts b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.facts span{font-size:.82rem;color:var(--muted)}
.finder{background:var(--deep);color:var(--deep-ink);border-radius:18px;padding:22px;display:grid;gap:12px;min-width:0}
.finder h3{font-size:1rem;font-family:var(--f-display)}
.finder label{font-size:.78rem;opacity:.8;display:grid;gap:5px}
.finder select,.finder input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:11px 12px;width:100%;color:var(--deep-ink)}
.finder option{color:#14201b}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}

section{padding-block:40px}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sort{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pic{aspect-ratio:16/9;max-width:100%;display:grid;place-items:end center;position:relative;overflow:hidden}
.pic svg{width:92%;height:auto;margin-bottom:6%}
.pic img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic.sold svg,.pic.sold img.ph{filter:grayscale(.85) opacity(.7)}
.tag{position:absolute;left:12px;top:12px;z-index:1;font-size:.72rem;font-weight:600;background:var(--surface);color:var(--ink);padding:4px 9px;border-radius:999px}
.tag.sold{background:var(--ink);color:var(--bg)}
.info{padding:16px;display:grid;gap:10px;flex:1}
.info h3{font-size:1rem}
.specs{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.price{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:6px}
.price b{font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.price button{padding:9px 13px;font-size:.85rem}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}
.steps{display:grid;gap:16px;margin-top:16px}
.steps div{display:grid;grid-template-columns:auto 1fr;gap:12px}
.steps .dot{width:34px;height:34px;border-radius:10px;background:var(--deep);color:var(--deep-ink);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.steps b{display:block}
.steps span.t{font-size:.9rem;color:var(--muted)}
.calc{display:grid;gap:14px;margin-top:16px}
.calc label{display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
.calc label span{display:flex;justify-content:space-between;color:var(--ink);font-weight:600}
.calc select,.calc input[type=range]{width:100%}
.calc select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
input[type=range]{accent-color:var(--accent)}
.result{background:var(--deep);color:var(--deep-ink);border-radius:14px;padding:16px}
.result b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.result small{opacity:.8}

form.contact{display:grid;gap:12px;margin-top:16px}
form.contact label{display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
form.contact input,form.contact textarea,form.contact select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.note{font-size:.88rem;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;gap:10px}
.note pre{white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--f-body);font-size:.88rem}
.note .row{display:flex;gap:10px;flex-wrap:wrap}
.hours{display:grid;gap:10px;margin-top:16px;font-size:.95rem}
.hours div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.hours span{color:var(--muted)}
.hours b{text-align:right;min-width:0;overflow-wrap:anywhere}
footer{padding-block:28px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--ink);font-weight:600}
.draftbar{margin-top:14px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:.9rem;font-weight:600}
.draftbar a{color:inherit}

/* owner panel */
.adm{padding-block:22px 60px;display:grid;gap:18px}
.adm-bar .wrap{flex-wrap:nowrap}
.adm-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.adm-actions .btn{padding:9px 13px;font-size:.88rem}
#status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.a-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.a-head h2{font-size:1.2rem}
.a-list{display:grid;gap:10px}
.a-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;min-width:0}
.a-thumb{aspect-ratio:16/9;border-radius:8px;overflow:hidden;position:relative;display:grid;place-items:end center}
.a-thumb svg{width:92%;height:auto;margin-bottom:4%}
.a-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.a-main{min-width:0;display:grid;gap:4px}
.a-main b{overflow-wrap:anywhere}
.a-main small{color:var(--muted)}
.a-ctl{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.a-ctl select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.a-ctl .btn{padding:8px 12px;font-size:.85rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.fld{display:grid;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:var(--ink)}
.fld input[type=color]{padding:3px;height:44px}
.fld small{color:var(--muted)}
.pv{aspect-ratio:16/9;max-width:320px;border-radius:12px;overflow:hidden;position:relative;display:grid;place-items:end center}
.pv svg{width:92%;height:auto;margin-bottom:4%}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.gate{padding-block:60px;display:grid;gap:16px;max-width:560px}

.dock{display:none}
@media (max-width:820px){
  .hero,.two,.form-grid{grid-template-columns:1fr}.hero{padding-block:28px}nav{display:none}
  .bar .wrap{flex-wrap:nowrap}.phone{padding:8px 11px;font-size:.82rem}
  main.pub{padding-bottom:84px}
  .grid{grid-template-columns:1fr}
  .dock{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
    padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dock .btn{padding:12px 10px}
  .adm-bar .logo{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* login */
.login{min-height:70vh;display:grid;place-items:center;padding-block:40px}
.login .panel{width:100%;max-width:400px;display:grid;gap:14px}
.login h2{font-size:1.3rem}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em}

/* phone fixes: 16px fields stop iOS zoom on focus; admin bar stays on one row */
select,input,textarea{font-size:1rem}
@media (max-width:560px){
  .adm-bar .logo{display:none}
  .adm-actions{width:100%;flex-wrap:nowrap}
  .adm-actions .btn{flex:1;padding:10px 6px;font-size:.82rem;white-space:nowrap}
}

/* gallery */
.pic[data-gal]{cursor:zoom-in}
.cnt{position:absolute;right:10px;bottom:10px;z-index:1;background:rgba(0,0,0,.62);color:#fff;font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:999px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,10,8,.94);display:grid;place-items:center;padding:56px 12px 64px}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;border-radius:999px;width:46px;height:46px;font-size:1.7rem;line-height:1}
.lb .lb-x{top:calc(10px + env(safe-area-inset-top,0px));right:12px}
.lb .lb-prev{left:10px;top:50%;transform:translateY(-50%)}
.lb .lb-next{right:10px;top:50%;transform:translateY(-50%)}
.lb-c{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:.9rem}
/* admin photo grid */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.th{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);display:grid}
.th img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.thb{display:flex;justify-content:space-between;gap:4px;padding:6px;font-size:.75rem}
.thb span{color:var(--good);font-weight:600}
.thb button{border:0;background:none;color:var(--ink);font-size:.75rem;cursor:pointer;padding:2px 4px;text-decoration:underline}
.thb button[data-act=rmphoto]{color:var(--bad)}

.pm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px;border:1px dashed var(--accent);border-radius:10px}
.pm .btn{padding:8px 12px;font-size:.85rem;cursor:pointer}
.pm .pmm{font-size:.8rem;color:var(--muted);flex:1 1 100%}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--deep);color:var(--deep-ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar~.dock{display:none!important}
.pbar span{flex:1 1 160px;font-size:.85rem}
.pbar .btn{padding:9px 12px;font-size:.85rem}
.pbar .btn.ghost{color:var(--deep-ink);border-color:rgba(255,255,255,.4)}
</style>
</head>

  document.body.appendChild(el);document.body.style.overflow='hidden';
  var img=el.querySelector('.lb-img'),cnt=el.querySelector('.lb-c'),pv=el.querySelector('.lb-prev'),nx=el.querySelector('.lb-next');
  function show(){img.src=list[i];img.alt=c.brand+' '+c.model;cnt.textContent=(i+1)+' / '+list.length+' · '+c.brand+' '+c.model;pv.hidden=nx.hidden=list.length<2}

  function close(){document.removeEventListener('keydown',key);el.remove();document.body.style.overflow=''}
  function key(e){if(e.key==='Escape')close();else if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1)}
  el.addEventListener('click',function(e){if(e.target.closest('.lb-x')||e.target===el)close();else if(e.target.closest('.lb-prev'))go(-1);else if(e.target.closest('.lb-next'))go(1)});
  var x0=null;

  el.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)go(dx<0?1:-1)});
  document.addEventListener('keydown',key);show();

  }
  var w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,r=Math.min(1,1000/Math.max(w,h));
  var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*r));cv.height=Math.max(1,Math.round(h*r));
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
  return new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',0.8)});
}
function upload(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=function(){rej(fr.error)};fr.readAsDataURL(blob)})}
function repaintKeep(){var y=window.scrollY;root.innerHTML=siteHTML();bindSite();window.scrollTo(0,y)}
async function addPhotos(id,files){
  var c=S.cars.filter(function(x){return x.id===id})[0];if(!c)return;
  var ph=photoList(c).slice(),fails=0,m=$('pmm'+id);
  for(var k=0;k<files.length&&ph.length<10;k++){
    if(m)m.textContent='Жүктөп жатам '+(k+1)+' / '+files.length+'...';
    try{ph.push(await upload(await shrink(files[k])))}catch(e){fails++}
  }
  c.photos=ph;c.photo=ph[0]||'';
  await saveDraft();repaintKeep();
  var m2=$('pmm'+id);if(m2){m2.textContent=fails?'Кээ бир сүрөт ('+fails+') жүктөлгөн жок. Башка сүрөт тандап көрүңүз (JPG же PNG).':'Жүктөлдү: '+ph.length+' сүрөт.';m2.style.color=fails?'var(--bad)':'var(--good)'}
}
async function clearPhotos(id){
  var c=S.cars.filter(function(x){return x.id===id})[0];if(!c)return;
  c.photos=[];c.photo='';await saveDraft();repaintKeep();
}
function buildDoc(){
  S.rev=Date.now();
  var data=JSON.stringify(S).replace(/</g,'\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
  return '<!doctype html>\n<html lang="ky">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+esc(S.s.name)+'</title>\n'+PWAHEAD+'<link rel="stylesheet" href="'+FONT+'">\n'+
    '<style id="app-css">'+$('app-css').textContent+'</style>\n</head>\n<body>\n<div id="root"></div>\n'+
    '<script type="application/json" id="site-data">'+data+'<\/script>\n<script id="app-js">'+$('app-js').textContent+'<\/script>\n</body>\n</html>\n';
}
function download(){
  var doc=buildDoc();saveDraft();
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download='index.html';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
  pst('Файл жүктөлдү (index.html). Аны хостингге жүктөңүз.');
}
function paint(){root.innerHTML=siteHTML();bindSite();window.scrollTo(0,0)}
function route(){var p=location.hash==='#foto';if(p!==PM){PM=p;paint()}}
window.addEventListener('hashchange',route);
PM=location.hash==='#foto';
(function(){
  var done=false;function go(){if(done)return;done=true;applyAccent();document.title=S.s.name;paint()}
  setTimeout(go,1500);
  kvGet('draft:'+S.siteId).then(function(d){if(d&&d.rev>(S.rev||0)&&d.s&&d.cars)S=d}).catch(function(){}).then(go);
})();

})();
</script>
